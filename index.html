<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grass Layout Planner Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container no-print">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Grass Planner</h2>
                <p>โปรแกรมวางผังหญ้าเทียม</p>
            </div>
            
            <div id="controls-area" class="controls-container">
                </div>

            <button class="print-btn" onclick="window.print()">
                <span>🖨️</span> ออกรายงาน (Print Report)
            </button>
        </aside>

        <main class="main-content">
            <div id="canvas-parent">
                </div>
            <div id="table-parent">
                </div>
        </main>
    </div>

    <div class="print-only-report">
        <div class="report-header">
            <h1>รายงานการวางผังหญ้าเทียมมาตรฐาน</h1>
            <p>Generated by Grass Layout Planner Pro</p>
        </div>
        <div id="report-canvas-copy"></div>
        <div id="report-table-copy"></div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
